name: Discord Weekly Raid Schedule Alert

on:
  schedule:
    # 매주 목요일 한국시간 오전 10시 (UTC 기준 목요일 01:00)
    - cron: '0 1 * * 4'
  workflow_dispatch: # 수동 테스트용

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Calculate and Send Schedule Alert
        run: |
          node -e '
          const https = require("https");

          const url = "https://raid-schedule-f1be5-default-rtdb.firebaseio.com/schedules.json";

          https.get(url, (res) => {
            let data = "";
            res.on("data", (chunk) => data += chunk);
            res.on("end", () => {
              try {
                const schedules = JSON.parse(data) || {};
                
                // 1. 오늘(목요일)부터 정확히 7일간(목~수)의 날짜(YYYY-MM-DD) 리스트 생성
                const targetDates = [];
                const today = new Date();
                
                for (let i = 0; i < 7; i++) {
                  const d = new Date(today);
                  d.setDate(today.getDate() + i);
                  
                  const year = d.getFullYear();
                  const month = String(d.getMonth() + 1).padStart(2, "0");
                  const day = String(d.getDate()).padStart(2, "0");
                  
                  targetDates.push(`${year}-${month}-${day}`);
                }

                // 2. 목요일~다음 주 수요일 기간 내에서 6인 이상인 날짜 필터링
                const availableDays = [];
                
                targetDates.forEach(dateStr => {
                  const attendees = schedules[dateStr];
                  // 웹사이트와 동일하게 배열 형태인지 확인하고 인원수(length) 체크
                  if (Array.isArray(attendees) && attendees.length >= 6) {
                    availableDays.push({ date: dateStr, count: attendees.length, members: attendees.join(", ") });
                  }
                });

                let msgContent = "🛡️ **[얼레벌레네레팟] 이번 주 레이드 가능 일정 안내** 🛡️\n*(기준: 목요일 ~ 다가오는 일주일)*\n\n";

                if (availableDays.length > 0) {
                  msgContent += "✨ **이번 주 레이드 출발 가능 날짜 (6인 이상):**\n";
                  availableDays.forEach(item => {
                    msgContent += `• **${item.date}** : **${item.count}명** 참여 (${item.members}) ⭕\n`;
                  });
                } else {
                  msgContent += "⚠️ **이번 주에는 목요일~수요일 사이에 6인 이상 모인 날짜가 없습니다.**\n";
                }

                msgContent += "\n🔗 **자세한 일정 확인/수정:** https://raid-schedule-tau.vercel.app/";

                // 디스코드 웹훅 전송
                const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
                if (!webhookUrl) {
                  console.error("WEBHOOK_URL이 설정되지 않았습니다.");
                  process.exit(1);
                }

                const payload = JSON.stringify({ content: msgContent });
                const urlObj = new URL(webhookUrl);

                const req = https.request({
                  hostname: urlObj.hostname,
                  path: urlObj.pathname + urlObj.search,
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Content-Length": Buffer.byteLength(payload)
                  }
                }, (res) => {
                  console.log("전송 완료! 상태 코드:", res.statusCode);
                });

                req.write(payload);
                req.end();

              } catch (e) {
                console.error("데이터 처리 중 에러:", e);
              }
            });
          }).on("error", (err) => {
            console.error("요청 실패:", err);
          });
          '
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}